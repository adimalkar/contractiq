# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ContractIQ — Production RAG Multi-Container Infrastructure
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ──── PostgreSQL with pgvector Extension ────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractiq-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-contractiq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contractiq_dev}
      POSTGRES_DB: ${DB_NAME:-contractiq}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - contractiq-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contractiq} -d ${DB_NAME:-contractiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - contractiq-net
    restart: unless-stopped

  # ──── Redis Distributed Cache & Celery Broker ────
  redis:
    image: redis:7-alpine
    container_name: contractiq-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - contractiq-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contractiq-net
    restart: unless-stopped

  # ──── ContractIQ FastAPI Application ────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-contractiq}:${DB_PASSWORD:-contractiq_dev}@postgres:5432/${DB_NAME:-contractiq}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      APP_ENV: production
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - contractiq-net
    restart: unless-stopped

  # ──── Celery Async Ingestion Worker ────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-celery-worker
    command: celery -A contractiq.pipeline.celery_app worker -l info -Q ingestion -c 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-contractiq}:${DB_PASSWORD:-contractiq_dev}@postgres:5432/${DB_NAME:-contractiq}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
    networks:
      - contractiq-net
    restart: unless-stopped

  # ──── Flower Celery Monitoring Dashboard ────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractiq-flower
    command: celery -A contractiq.pipeline.celery_app flower --port=5555
    depends_on:
      - celery-worker
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - contractiq-net
    restart: unless-stopped

  # ──── OpenTelemetry Collector ────
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: contractiq-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - contractiq-net
    restart: unless-stopped

volumes:
  contractiq-pgdata:
  contractiq-redis-data:

networks:
  contractiq-net:
    driver: bridge
